name: Build and Release

on:
  push:
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Wichtig für git describe (Tags müssen vorhanden sein)

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2 python3-venv wget

      - name: Build AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1 # Verhindert Fehler beim Packen im CI
        run: |
          chmod +x scripts/build_linux_appimage.sh
          ./scripts/build_linux_appimage.sh

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pyCol-Linux-AppImage
          path: build/pyCol-x86_64.AppImage

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Wichtig für git describe

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Build Windows Installer
        shell: cmd
        run: |
          scripts\build_win_installer.bat nopause

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pyCol-Windows-Packages
          path: dist/pyCol*.exe

  release:
    needs: [build-linux, build-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
        
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/pyCol-Linux-AppImage/*.AppImage
            artifacts/pyCol-Windows-Packages/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
